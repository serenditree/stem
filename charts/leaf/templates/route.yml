{{- if hasPrefix "serenditree-openshift" .Values.global.context }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: leaf
  namespace: serenditree
  labels:
    {{- include "st-default-labels" . }}
spec:
  host: ""
  subdomain: ""
  port:
    targetPort: 8080
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
  to:
    kind: Service
    name: leaf
    weight: 100
  wildcardPolicy: None
{{- end}}
