{{- if .Values.terraScale.karpenter }}
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: standard-main
spec:
  template:
    metadata:
      labels:
        nodepool: standard-main
    spec:
      nodeClassRef:
        group: karpenter.exoscale.com
        kind: ExoscaleNodeClass
        name: standard
      requirements:
        - key: "node.kubernetes.io/instance-type"
          operator: In
          values:
            - "standard.medium"
            - "standard.large"
      expireAfter: 24h
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30m
    budgets:
      - nodes: "10%"
  limits:
    cpu: 32
    memory: 16Gi
{{- end }}
