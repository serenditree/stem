{{- if and .Values.terraScale.karpenterBaseline (not .Values.terraScale.karpenterReplicas) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.terraScale.karpenterBaselineName }}
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.terraScale.karpenterBaselineName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.terraScale.karpenterBaselineName }}
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: {{ .Values.terraScale.karpenterBaselineName }}
      containers:
        - name: pause
          image: registry.k8s.io/pause:latest
          resources:
            requests:
              cpu: 64m
              memory: 64Mi
            limits:
              cpu: 64m
              memory: 64Mi
{{- end }}
