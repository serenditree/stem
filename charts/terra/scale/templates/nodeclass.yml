{{- if .Values.terraScale.karpenter }}
apiVersion: karpenter.exoscale.com/v1
kind: ExoscaleNodeClass
metadata:
  name: standard
spec:
  imageTemplateSelector:
    variant: "standard"
  diskSize: 64
  securityGroups:
    - {{ .Values.terraScale.securityGroup }}
  privateNetworks:
    - {{ .Values.terraScale.privateNetwork }}
  antiAffinityGroups:
    - {{ .Values.terraScale.antiAffinityGroup }}
{{- end }}
