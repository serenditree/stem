#file: noinspection HelmChartUnknownValues
apiVersion: v2
type: application
name: terra-cache
description: Valkey resources.
version: 0.0.1
appVersion: 0.0.1
dependencies:
  - name: valkey
    repository: https://valkey.io/valkey-helm
    version: 0.11.0
    condition: terraCache.valkeyHelm
  - name: valkey-operator
    repository: https://valkey.io/valkey-helm
    version: 0.4.0
    condition: terraCache.valkeyOperator
  - name: commons
    repository: oci://quay.io/serenditree/charts
    version: 0.0.1
    condition: global.wait
