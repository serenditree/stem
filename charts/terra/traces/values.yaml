global:
  wait: ~
  wave: ~
metastore:
  secretRef: postgres-basic-auth
  secretUriRef: postgres-uri-auth
  database: metastore
  username: quickwit
  retention: quickwit-retention
quickwit:
  fullnameOverride: traces
  searcher:
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 150Mi
      limits:
        cpu: 100m
        memory: 150Mi
    extraEnvFrom:
      - secretRef:
          name: s3-credentials
  indexer:
    replicaCount: 2
    resources:
     requests:
       cpu: 100m
       memory: 150Mi
     limits:
       cpu: 100m
       memory: 150Mi
    extraEnvFrom:
      - secretRef:
          name: s3-credentials
  metastore:
    replicaCount: 1
    extraEnvFrom:
      - secretRef:
          name: postgres-uri-auth
      - secretRef:
          name: s3-credentials
  janitor:
    enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 150Mi
      limits:
        cpu: 100m
        memory: 150Mi
    extraEnvFrom:
      - secretRef:
          name: s3-credentials
  control_plane:
    enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 150Mi
      limits:
        cpu: 100m
        memory: 150Mi
    extraEnvFrom:
      - secretRef:
          name: s3-credentials
  config:
    storage:
      s3:
        region: ~
        endpoint: ~
        access_key_id: '${QW_STORAGE_S3_ACCESS_KEY_ID}'
        secret_access_key: '${QW_STORAGE_S3_SECRET_ACCESS_KEY}'
