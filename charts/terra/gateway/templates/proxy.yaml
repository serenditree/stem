---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ .Values.terraGateway.config }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        annotations:
          service.beta.kubernetes.io/exoscale-loadbalancer-service-strategy: 'round-robin'
          service.beta.kubernetes.io/exoscale-loadbalancer-name: 'serenditree'
  telemetry:
    tracing:
      samplingRate: 10
      provider:
        backendRefs:
          - group: ''
            kind: Service
            name: collect
            namespace: terra-collect
            port: 4317
        type: OpenTelemetry
      customTags:
        provider:
          type: Literal
          literal:
            value: 'otel-collector'
        "k8s.pod.name":
          type: Environment
          environment:
            name: ENVOY_POD_NAME
            defaultValue: 'envoy'
        "k8s.namespace.name":
          type: Environment
          environment:
            name: ENVOY_GATEWAY_NAMESPACE
            defaultValue: 'terra-gateway'
