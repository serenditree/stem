global:
  wait: ~
  wave: ~
victoria-metrics-k8s-stack:
  fullnameOverride: terra-scope
########################################################################################################################
# VictoriaMetrics
########################################################################################################################
  vmsingle:
    spec:
      retentionPeriod: 1w
      resources:
        requests:
          cpu: 100m
          memory: 400Mi
        limits:
          cpu: 200m
          memory: 400Mi
      storage:
        storageClassName: exoscale-sbs
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
  prometheus-node-exporter:
    resources:
     requests:
       cpu: 100m
       memory: 50Mi
     limits:
       cpu: 200m
       memory: 50Mi
  kubeProxy:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeControllerManager:
    enabled: false
########################################################################################################################
# VictoriaLogs
########################################################################################################################
  vlsingle:
    enabled: true
    spec:
      retentionPeriod: 1w
      resources:
        requests:
          cpu: 100m
          memory: 150Mi
        limits:
          cpu: 200m
          memory: 150Mi
      storage:
        storageClassName: exoscale-sbs
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
########################################################################################################################
# VictoriaTraces
########################################################################################################################
  vtsingle:
    enabled: true
    spec:
      retentionPeriod: 1w
      resources:
        requests:
          cpu: 100m
          memory: 150Mi
        limits:
          cpu: 200m
          memory: 150Mi
      storage:
        storageClassName: exoscale-sbs
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
########################################################################################################################
# Alertmanager
########################################################################################################################
  alertmanager:
    spec:
      resources:
        requests:
          cpu: 100m
          memory: 300Mi
        limits:
          cpu: 200m
          memory: 300Mi
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: exoscale-sbs
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi
      secrets:
        - slack-api-url
    config:
      global:
        resolve_timeout: 5m
        slack_api_url_file: /etc/vm/secrets/slack-api-url/slack-api-url
      route:
        receiver: slack
        group_by:
          - alertname
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 3h
        routes:
          - receiver: "null"
            matchers:
              - 'alertname =~ "Watchdog|KubeClientCertificateExpiration|InfoInhibitor"'
          - receiver: slack
      receivers:
        - name: slack
          slack_configs:
            - channel: "#alerts"
              send_resolved: true
              title: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"
              text: "{{ range .Alerts }}*{{ .Annotations.summary }}*\n{{ .Annotations.description }}\n\n{{ end }}"
        - name: "null"
########################################################################################################################
# Grafana
########################################################################################################################
  grafana:
    resources:
      requests:
        cpu: 100m
        memory: 300Mi
      limits:
        cpu: 200m
        memory: 300Mi
    admin:
      existingSecret: grafana-credentials
      userKey: username
      passwordKey: password
    replicas: 1
    persistence:
      enabled: true
      accessModes:
        - ReadWriteOnce
      size: 10Gi
    plugins:
      - victoriametrics-logs-datasource
