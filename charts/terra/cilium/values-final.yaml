cilium:
  cluster:
    name: ~
  kubeProxyReplacement: true
  k8sServiceHost: ~
  k8sServicePort: 443
  encryption:
    enabled: true
    type: ipsec
    ipsec:
      secretName: cilium-ipsec-key
      keyFile: key
  envoy:
    enabled: true
  hubble:
    enabled: true
    relay:
      enabled: true
    ui:
      enabled: true
    metrics:
      enableOpenMetrics: true
      enabled:
        - httpV2:exemplars=true;labelsContext=source_namespace,source_app,source_ip,destination_namespace,destination_app,destination_ip,traffic_direction
        - dns
        - drop
        - tcp
        - flow
        - port-distribution
        - icmp
########################################################################################################################
# Updates to bootstrap
########################################################################################################################
      serviceMonitor:
        enabled: true
      dashboards:
        enabled: true
  dashboards:
    enabled: true
  operator:
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
  prometheus:
    enabled: true
    serviceMonitor:
      trustCRDsExist: true
      enabled: true
