{{ range tuple "seed" "user" }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: fence-root-{{ . }}
  namespace: serenditree
spec:
  endpointSelector:
    matchLabels:
      serenditree.io/policy: fence-root-{{ . }}
  ingress:
    - fromEntities:
        - cluster
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: serenditree-backup-{{ . }}.sos-at-vie-1.exo.io
    {{- if eq "seed" . }}
        - matchName: artifacts.opensearch.org
    {{- end }}
    - toEndpoints:
        - matchLabels:
            serenditree.io/policy: fence-root-{{ . }}
{{- end }}
