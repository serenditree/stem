{{ range without .Values.branch.branches "garden" }}
{{- $branchName := printf "%s-%s" "branch" . }}
{{- $branch := . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $branchName }}
  labels:
    {{- include "st-default-labels-range" (dict "name" $branchName "context" $) }}
spec:
  revisionHistoryLimit: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      name: {{ $branchName }}
  template:
    metadata:
      labels:
        {{- include "st-default-labels-range" (dict "name" $branchName "context" $) | indent 4 }}
        name: {{ $branchName }}
    spec:
      restartPolicy: Always
      containers:
        - name: {{ $branchName }}
          image: "quay.io/serenditree/{{ $branchName }}:latest"
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: branch
          env:
            - name: SERENDITREE_JSON_WEB_KEY
              valueFrom:
                secretKeyRef:
                  key: json-web-key
                  name: branch
            {{- range $.Values.branch.oidc }}
            - name: QUARKUS_OIDC_{{ . | upper }}_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: oidc-id-{{ . }}
                  name: branch
            - name: QUARKUS_OIDC_{{ . | upper }}_CREDENTIALS_SECRET
              valueFrom:
                secretKeyRef:
                  key: oidc-secret-{{ . }}
                  name: branch
            - name: QUARKUS_OIDC_{{ . | upper }}_AUTH_SERVER_URL
              valueFrom:
                secretKeyRef:
                  key: oidc-url-{{ . }}
                  name: branch
            - name: QUARKUS_OIDC_{{ . | upper }}_APPLICATION_TYPE
              value: web-app
            {{- end }}
            - name: SERENDITREE_ROOT_USER_USER
              valueFrom:
                secretKeyRef:
                  key: database-user
                  name: root-user
            - name: SERENDITREE_ROOT_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: database-password
                  name: root-user
            - name: QUARKUS_SWAGGER_UI_ALWAYS_INCLUDE
              value: "false"
            - name: QUARKUS_OTEL_TRACES_SAMPLER_ARG
              value: {{ $.Values.branch.otlp.traceRatio | quote }}
          resources:
            {{- if eq $branch "seed" }}
            requests:
              cpu: 500m
              memory: 500Mi
            limits:
              cpu: 500m
              memory: 1Gi
            {{- else }}
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
            {{- end }}
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: 8080
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              port: 8080
              path: "/q/health/ready"
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
{{- end }}
