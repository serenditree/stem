---
apiVersion: v1
kind: ConfigMap
metadata:
  name: branch
  labels:
    {{- include "st-default-labels" . }}
data:
  QUARKUS_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: {{ .Values.branch.otlp.endpoint | quote }}
  SERENDITREE_HOST: "https://{{ .Values.global.host }}"
  SERENDITREE_LOG_LEVEL: {{ .Values.branch.logLevel | quote }}
  SERENDITREE_SEED_RETENTION: {{ .Values.branch.waterRetention | quote }}
