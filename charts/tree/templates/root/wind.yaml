---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.rootWind.name }}
  namespace: {{ .Values.global.cdNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.rootWind.wave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.global.repository | quote }}
    path: "{{ .Values.global.rootPath }}/{{ trimPrefix .Values.global.rootPrefix .Values.rootWind.name }}"
    targetRevision: {{ .Values.rootWind.revision | default .Values.global.revision | quote }}
    helm:
      parameters:
        - name: global.context
          value: {{ .Values.global.context }}
  destination:
    server: {{ .Values.global.destinationServer }}
    namespace: {{ .Values.rootSeed.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
