apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.rootMap.name }}
  namespace: {{ .Values.global.cdNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.rootMap.wave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.global.repository | quote }}
    path: "{{ .Values.global.rootPath }}/{{ trimPrefix .Values.global.rootPrefix .Values.rootMap.name }}"
    targetRevision: {{ .Values.rootMap.revision | default .Values.global.revision | quote }}
    helm:
      parameters:
        - name: global.context
          value: {{ .Values.global.context | quote }}
        - name: global.stage
          value: {{ .Values.global.stage | quote }}
        - name: global.issuer
          value: {{ .Values.global.issuer | quote }}
        - name: global.host
          value: {{ .Values.global.host | quote }}
        - name: rootMap.data.apikey
          value: {{ .Values.rootMap.parameters.data.apikey | quote }}
        - name: rootMap.data.secret
          value: {{ .Values.rootMap.parameters.data.secret| quote }}
  destination:
    server: {{ .Values.global.destinationServer }}
    namespace: {{ .Values.rootMap.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
