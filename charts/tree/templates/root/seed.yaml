apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.rootSeed.name }}
  namespace: {{ .Values.global.cdNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.rootSeed.wave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.global.repository | quote }}
    path: "{{ .Values.global.rootPath }}/{{ trimPrefix .Values.global.rootPrefix .Values.rootSeed.name }}"
    targetRevision: {{ .Values.rootSeed.revision | default .Values.global.revision | quote }}
    helm:
      parameters:
        - name: global.context
          value: {{ .Values.global.context | quote }}
        - name: elasticsearch.clusterDomain
          value: {{ .Values.global.clusterDomain | quote }}
        - name: rootSeed.backup.accessKey
          value: {{ .Values.rootSeed.parameters.backup.accessKey | quote }}
        - name: rootSeed.backup.accessSecret
          value: {{ .Values.rootSeed.parameters.backup.accessSecret | quote }}
  destination:
    server: {{ .Values.global.destinationServer }}
    namespace: {{ .Values.rootSeed.namespace }}
  syncPolicy:
    automated: {{ .Values.global.automated | toYaml | nindent 6 }}
    retry: {{ .Values.global.retry | toYaml | nindent 6  }}
    syncOptions:
      - CreateNamespace=true
