apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.rootSeed.name }}
  namespace: {{ .Values.global.cdNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.rootSeed.wave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.global.repository | quote }}
    path: "{{ .Values.global.rootPath }}/{{ trimPrefix .Values.global.rootPrefix .Values.rootSeed.name }}"
    targetRevision: {{ .Values.rootSeed.revision | default .Values.global.revision | quote }}
    helm:
      parameters:
        - name: global.context
          value: {{ .Values.global.context | quote }}
        - name: mongodb.clusterDomain
          value: {{ .Values.global.clusterDomain | quote }}
        - name: mongodb.auth.usernames[0]
          value: {{ .Values.rootSeed.parameters.auth.usernames | quote }}
        - name: rootSeed.auth.usernames
          value: {{ .Values.rootSeed.parameters.auth.usernames | quote }}
        - name: rootSeed.auth.passwords
          value: {{ .Values.rootSeed.parameters.auth.passwords | quote }}
        - name: rootSeed.auth.rootPassword
          value: {{ .Values.rootSeed.parameters.auth.rootPassword | quote }}
  destination:
    server: {{ .Values.global.destinationServer }}
    namespace: {{ .Values.rootSeed.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
