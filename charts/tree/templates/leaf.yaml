apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.leaf.name }}
  namespace: {{ .Values.global.cdNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.leaf.wave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.global.repository | quote }}
    path: "{{ .Values.global.path }}/{{ .Values.leaf.name }}"
    targetRevision: {{ .Values.leaf.revision | default .Values.global.revision | quote }}
    helm:
      parameters:
        - name: global.context
          value: {{ .Values.global.context }}
        - name: global.stage
          value: {{ .Values.global.stage }}
        - name: global.issuer
          value: {{ .Values.global.issuer }}
        - name: global.host
          value: {{ .Values.global.host | quote }}
        - name: leaf.otlp.host
          value: "collect.{{ .Values.terraCollect.namespace }}.svc.{{ .Values.global.clusterDomain }}"
  destination:
    server: {{ .Values.global.destinationServer }}
    namespace: {{ .Values.leaf.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
