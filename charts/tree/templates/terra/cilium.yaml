---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.terraCilium.name }}
  namespace: {{ .Values.global.cdNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.terraCilium.wave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.global.repository | quote }}
    path: "{{  .Values.global.terraPath }}/{{ trimPrefix .Values.global.terraPrefix .Values.terraCilium.name }}"
    targetRevision: {{ .Values.terraCilium.revision | default .Values.global.revision | quote }}
    helm:
      parameters:
        - name: cilium.cluster.name
          value: {{ .Values.terraCilium.parameters.cluster.name }}
        - name: cilium.k8sServiceHost
          value: {{ .Values.terraCilium.parameters.k8sServiceHost }}
  destination:
    server: {{ .Values.global.destinationServer }}
    namespace: {{ .Values.terraCilium.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
