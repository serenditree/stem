---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.terraArgocd.name }}
  namespace: {{ .Values.global.cdNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.terraArgocd.wave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.global.repository | quote }}
    path: "{{ .Values.global.terraPath }}/{{ trimPrefix .Values.global.terraPrefix .Values.terraArgocd.name }}"
    targetRevision: {{ .Values.terraArgocd.revision | default .Values.global.revision | quote }}
  destination:
    server: {{ .Values.global.destinationServer }}
    namespace: {{ .Values.global.cdNamespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
