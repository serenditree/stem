{{- if .Values.terraScope.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.terraScope.name }}
  namespace: {{ .Values.global.cdNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.terraScope.wave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.global.repository | quote }}
    path: "{{ .Values.global.terraPath }}/{{ trimPrefix .Values.global.terraPrefix .Values.terraScope.name }}"
    targetRevision: {{ .Values.terraScope.revision | default .Values.global.revision | quote }}
    helm:
      parameters:
        - name: kube-prometheus-stack.grafana.adminPassword
          value: {{ .Values.terraScope.parameters.password | quote }}
        - name: kube-prometheus-stack.alertmanager.config.global.slack_api_url
          value: {{ .Values.terraScope.parameters.webhook | quote }}
  destination:
    server: {{ .Values.global.destinationServer }}
    namespace: {{ .Values.terraScope.namespace }}
  syncPolicy:
    automated: {{ .Values.global.automated | toYaml | nindent 6 }}
    retry: {{ .Values.global.retry | toYaml | nindent 6  }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
