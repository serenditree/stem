---
apiVersion: v1
kind: Secret
metadata:
  name: root-user
  labels:
    {{- include "st-default-labels-component" . }}
type: Opaque
data:
  database-name: {{ .Values.rootUser.db.name | b64enc }}
  database-user: {{ .Values.rootUser.db.user | b64enc }}
  database-password: {{ .Values.rootUser.db.password | b64enc }}
  database-root-password: {{ .Values.rootUser.rootUser.password | b64enc }}
  postgres-password: {{ .Values.rootUser.rootUser.password | b64enc }}
  password: {{ .Values.rootUser.db.password | b64enc }}
  repmgr-password: {{ .Values.rootUser.rootUser.password | b64enc }}
  admin-password: {{ .Values.rootUser.rootUser.password | b64enc }}
  usernames: {{ "postgres" | b64enc }}
  passwords: {{ .Values.rootUser.rootUser.password | b64enc }}
