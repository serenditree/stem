---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: root-map
  labels:
    {{- include "st-default-labels" . }}
spec:
  parentRefs:
    - name: serenditree
      namespace: terra-gateway
  hostnames:
    - {{ .Values.global.host }}
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: root-map
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /styles
        - path:
            type: PathPrefix
            value: /fonts
        - path:
            type: PathPrefix
            value: /data
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: root-map
  labels:
    {{- include "st-default-labels" . }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: root-map
  rateLimit:
    type: Global
    global:
      rules:
        - limit:
            requests: 42
            unit: Second
