{{- with .Values.kafka }}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: {{ .name }}
  labels:
    strimzi.io/cluster: {{ .name }}
spec:
  replicas: {{ .replicas }}
  roles:
    - controller
    - broker
  storage:
    volumes:
    {{- if hasSuffix "local" $.Values.global.context }}
      - id: 0
        type: ephemeral
    {{- else }}
      - id: 0
        type: persistent-claim
        size: "{{ .storage | int }}Gi"
        deleteClaim: false
        kraftMetadata: shared
    {{- end }}
{{- end }}
