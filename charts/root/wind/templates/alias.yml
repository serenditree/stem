apiVersion: v1
kind: Service
metadata:
  name: root-wind
spec:
  type: ClusterIP
  selector:
    strimzi.io/cluster: root-wind
    strimzi.io/kind: Kafka
    strimzi.io/name: root-wind-kafka
  ports:
    - name: tcp-replication
      port: 9091
      protocol: TCP
      targetPort: 9091
    - name: tcp-clients
      port: 9092
      protocol: TCP
      targetPort: 9092
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  internalTrafficPolicy: Cluster
  sessionAffinity: None
