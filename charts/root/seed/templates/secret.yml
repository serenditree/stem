---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.opensearch.extraEnvVarsSecret }}
  labels:
    {{- include "st-default-labels-component" . }}
type: Opaque
data:
  S3_ACCESS_KEY: {{ .Values.rootSeed.backup.accessKey | b64enc }}
  S3_SECRET_KEY: {{ .Values.rootSeed.backup.accessSecret | b64enc }}
