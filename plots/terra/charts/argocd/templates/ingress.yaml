{{- if .Values.global.setupApps }}
{{- if not (hasSuffix "-local" .Values.global.context) }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: terra-ingress
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'git@github.com:serenditree/stem.git'
    targetRevision: dev
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: ingress-nginx.controller.config.global-rate-limit-memcached-host
          value: 'terra-cache-memcached.ingress-nginx.svc.{{ .Values.global.clusterDomain }}'
{{/*        - name: ingress-nginx.controller.config.otlp-collector-host*/}}
{{/*          value: 'otel-daemon-collector.terra-scope.svc.{{ .Values.global.clusterDomain }}'*/}}
    path: plots/terra/charts/ingress
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: ingress-nginx
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
{{- end }}
{{- end }}
